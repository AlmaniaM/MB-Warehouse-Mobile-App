<ion-tabs>
  @if (!isInEntryPage()) {
    <ion-tab-bar slot="bottom" [color]="'primary'">
      <ion-tab-button tab="mbn-ledger">
        <ion-icon ios="grid-outline" md="grid-sharp"></ion-icon>
        MBN Ledger
      </ion-tab-button>
      <ion-tab-button tab="customer-ledger">
        <ion-icon ios="people-outline" md="people-sharp"></ion-icon>
        Customer Ledger
      </ion-tab-button>
      <ion-tab-button tab="return-receipts">
        <ion-icon ios="receipt-outline" md="receipt-sharp"></ion-icon>
        Return Receipts
      </ion-tab-button>
    </ion-tab-bar>
  }
</ion-tabs>
