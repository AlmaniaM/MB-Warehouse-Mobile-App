<div class="report-container">
  @if (isFetching()) {
    <ion-progress-bar type="indeterminate"></ion-progress-bar>
  }
  @if (reportType() === 'html' && receiptReportHtml()) {
    <div class="html-report" [innerHTML]="receiptReportHtml()!"></div>
  }
  @if (reportType() === 'pdf') {
    <iframe *ngIf="receiptReportPdfUrl()" class="pdf-report" [src]="receiptReportPdfUrl()!"></iframe>
  }
</div>
