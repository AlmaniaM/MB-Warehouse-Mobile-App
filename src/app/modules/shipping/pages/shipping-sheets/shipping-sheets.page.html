<app-page-topbar title="All Shipping Sheets"></app-page-topbar>
<ion-content>
  <app-content-topbar title="Shipping Sheets" [showRefresher]="true" />
  <app-shipping-sheets-list (shippingSheetClick)="onShippingSheetClick($event)" />
<ion-fab slot="fixed" horizontal="end" vertical="bottom">
  <ion-fab-button color="success" (click)="isCreatingShippingSheet.set(true)">
    <ion-icon ios="add-outline" md="add-sharp"></ion-icon>
  </ion-fab-button>
</ion-fab>
<ion-modal aria-modal [isOpen]="isCreatingShippingSheet()" (didDismiss)="isCreatingShippingSheet.set(false)">
  <ng-template>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title size="small">New Shipping Sheet</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="isCreatingShippingSheet.set(false)">
            <ion-icon slot="icon-only" ios="close-outline" md="close-sharp"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content id="new-shipping-sheet-container">
      @if (isCreatingShippingSheet()) {
        <app-shipping-sheet-form
          [formType]="'new'"
          [initialShippingSheet]="null"
          (formCancel)="onFormCancel()"
          (formSubmit)="onFormSubmit()">
        </app-shipping-sheet-form>
      }
    </ion-content>
  </ng-template>
</ion-modal>
