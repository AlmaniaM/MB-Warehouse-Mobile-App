<ion-header>
  <ion-toolbar color="primary">
    <ion-title size="small">Select {{ label() }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="selectionCancelledChanged.emit()">
        <ion-icon slot="icon-only" ios="close-outline" md="close-sharp"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar [(ngModel)]="searchFilter"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">  
  <ion-list>
    @for (plantedField of filteredPlantedFields(); track plantedField.id) {
      <ion-item>
        <ion-checkbox [value]="plantedField" 
          [checked]="isChecked(plantedField)"
          (ionChange)="checkboxChange($event)">
          {{ plantedField.field }}
        </ion-checkbox>
      </ion-item>
    }
  </ion-list>
</ion-content>
<ion-footer class="ion-padding">
  <ion-button expand="block" fill="outline" [color]="'success'"
    [disabled]="selectedPlantedFields().length === 0"
    (click)="selectedPlantedFieldsChanged.emit(this.selectedPlantedFields())">
    Select ({{ selectedPlantedFields().length }}) Planted Fields 
    <ion-icon slot="end" ios="checkmark-outline" md="checkmark-sharp"></ion-icon>
  </ion-button>
  <ion-button expand="block" fill="outline" 
    (click)="selectionCancelledChanged.emit()">
    Cancel
    <ion-icon slot="end" ios="close-outline" md="close-sharp"></ion-icon>
  </ion-button>
</ion-footer>
