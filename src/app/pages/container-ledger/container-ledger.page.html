<ion-content class="ion-padding">
  <!-- Filter Controls -->
  <app-dropdown-select
    label="Container Type"
    [placeholder]="'Select Container Types'"
    [options]="containerTypeOptions()"
    [allowNullOption]="false"
    [multiple]="true"
    [(selectedValue)]="selectedContainerTypes"
    (selectionChange)="onContainerTypeSelect($event)"
  />

  <!-- Container Ledger Table Component -->
  <app-container-ledger-table
    [containerTypes]="selectedContainerTypes()"
    [ledgerEntries]="ledgerEntries()"
    [isLoading]="isLoading()"
    [disableSummary]="true"
  />

  <!-- Reusable Ledger Entry FAB Component -->
  <app-ledger-entry-fab
    (entryCreated)="onLedgerEntryCreated($event)"
  ></app-ledger-entry-fab>
</ion-content>
