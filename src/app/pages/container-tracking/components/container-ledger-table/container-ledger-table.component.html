<app-list-view
  [title]="'Container Ledger'"
  [totals]="containerTypeTotals()"
  [items]="filteredEntries()"
  [isLoading]="isLoading()"
  [disableSummary]="disableSummary()"
  [emptyStateMessage]="'No ledger entries found'"
  [trackByFn]="trackByEntryId.bind(this)"
>
  <!-- Filter Template -->
  @if (!disableFilters()) {
  <ng-template #filterTemplate>
    <app-dropdown-select
      label="Container Type"
      [placeholder]="'Select Container Types'"
      [options]="containerTypeOptions()"
      [allowNullOption]="false"
      [multiple]="true"
      [selectedValue]="selectedContainerTypes()"
      (selectionChange)="onContainerTypeChange($event)"
    />
  </ng-template>
  }

  <!-- Total Quantity Template -->
  <ng-template #summaryTemplate>
    <ion-card class="total-quantity-card">
      <ion-card-content>
        <div class="total-display">
          <div class="total-label">Total Quantity</div>
          <div
            class="total-value"
            [ngClass]="{
              positive: containerTypeTotals() > 0,
              negative: containerTypeTotals() < 0,
              neutral: containerTypeTotals() === 0
            }"
          >
            <ion-icon
              [name]="
                containerTypeTotals() > 0
                  ? 'arrow-up'
                  : containerTypeTotals() < 0
                  ? 'arrow-down'
                  : 'remove'
              "
              [color]="
                containerTypeTotals() > 0
                  ? 'success'
                  : containerTypeTotals() < 0
                  ? 'danger'
                  : 'medium'
              "
            ></ion-icon>
            <span>{{ containerTypeTotals() }}</span>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </ng-template>

  <!-- Item Template -->
  <ng-template #itemTemplate let-entry>
    <ion-item lines="full" class="ledger-item" button="false" detail="false">
      <div class="ledger-entry-container">
        <!-- Top Section: Container Type & Date -->
        <div class="entry-header">
          <div class="container-type">
            {{ entry.containerTypeName || "Unknown Type" }}
          </div>
          <div class="entry-date">
            {{ entry.date | date : "MMM d, y" }}
          </div>
        </div>

        <!-- Middle Section: Customer Info -->
        <div class="entry-details">
          @if (entry.customerName) {
          <div class="customer-info">
            {{ entry.customerName }}
          </div>
          }
        </div>

        <!-- Bottom Section: Quantity & Note -->
        <div class="entry-footer">
          <div class="quantity-row">
            <div class="note-container">
              @if (entry.note) {
              <div class="note">{{ entry.note }}</div>
              }
            </div>
            <div
              [ngClass]="{
                quantity: true,
                positive: entry.quantity && entry.quantity > 0,
                negative: entry.quantity && entry.quantity < 0
              }"
            >
              {{ formatQuantity(entry.quantity) }}
            </div>
          </div>
        </div>
      </div>
    </ion-item>
  </ng-template>
</app-list-view>
