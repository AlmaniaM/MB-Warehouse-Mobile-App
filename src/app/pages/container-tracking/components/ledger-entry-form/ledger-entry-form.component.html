<div class="form-container">
  <div class="form-content">
    <!-- Container Type -->
    <app-dropdown-select
      label="Container Type *"
      placeholder="Select a container type"
      [options]="containerTypeOptions()"
      [allowNullOption]="false"
      [multiple]="false"
      [(selectedValue)]="selectedContainerType"
      (selectionChange)="validateForm()"
      [enableSearch]="true"
    />

    <!-- Quantity -->
    <ion-item>
      <ion-label position="stacked">Quantity *</ion-label>
      <ion-input
        type="number"
        [value]="quantity()"
        (ionChange)="setQuantity($event.detail.value)"
        placeholder="Enter quantity"
      ></ion-input>
    </ion-item>

    <!-- Date -->
    <ion-item button (click)="isDatePickerOpen.set(true)">
      <ion-label position="stacked">Date *</ion-label>
      <ion-input readonly [value]="date() | date : 'MMM d, y'">
        <ion-icon slot="end" name="calendar-outline"></ion-icon>
      </ion-input>
    </ion-item>

    <!-- Date Picker Modal -->
    <ion-modal
      [isOpen]="isDatePickerOpen()"
      (didDismiss)="isDatePickerOpen.set(false)"
      class="date-picker-modal"
    >
      <ng-template>
        <ion-datetime
          presentation="date"
          [value]="date()"
          (ionChange)="onDateSelected($event)"
          [showDefaultButtons]="true"
        ></ion-datetime>
      </ng-template>
    </ion-modal>

    <!-- From/To Type Selection -->
    <div class="type-selector">
      <app-dropdown-select
        label="From"
        placeholder="Select source type"
        [options]="fromTypeOptions()"
        [allowNullOption]="false"
        [multiple]="false"
        [(selectedValue)]="fromType"
        (selectionChange)="onFromTypeChange()"
        [enableSearch]="true"
      />

      <app-dropdown-select
        label="To"
        placeholder="Select destination type"
        [options]="toTypeOptions()"
        [allowNullOption]="false"
        [multiple]="false"
        [(selectedValue)]="toType"
        (selectionChange)="onToTypeChange()"
        [enableSearch]="true"
      />
    </div>

    <!-- Customer Selection (only shown if either from or to type is Customer) -->
    @if (fromType() === 'Customer' || toType() === 'Customer') {
    <app-dropdown-select
      label="Customer *"
      placeholder="Select a customer"
      [options]="customerOptions()"
      [allowNullOption]="false"
      [multiple]="false"
      [(selectedValue)]="selectedCustomer"
      (selectionChange)="validateForm()"
      [enableSearch]="true"
    />

    <!-- Customer Invoice Number (optional) -->
    <ion-item>
      <ion-label position="stacked">Invoice Number</ion-label>
      <ion-input
        type="text"
        [value]="customerInvoiceNumber()"
        (ionChange)="setCustomerInvoiceNumber($event.detail.value)"
        placeholder="Enter invoice number"
      ></ion-input>
    </ion-item>

    <!-- Customer Ranch (optional) -->
    <ion-item>
      <ion-label position="stacked">Ranch</ion-label>
      <ion-input
        type="text"
        [value]="customerRanch()"
        (ionChange)="customerRanch.set($event.detail.value || '')"
        placeholder="Enter ranch"
      ></ion-input>
    </ion-item>
    }

    <!-- Notes (optional) -->
    <ion-item>
      <ion-label position="stacked">Notes</ion-label>
      <ion-textarea
        [value]="note()"
        (ionChange)="note.set($event.detail.value || '')"
        placeholder="Enter notes"
        rows="3"
      ></ion-textarea>
    </ion-item>
  </div>

  <!-- Form Actions -->
  <div class="form-actions">
    <ion-button fill="outline" color="primary" (click)="resetForm()">
      Reset
    </ion-button>
    <ion-button
      color="secondary"
      [disabled]="!formValid() || isLoading()"
      (click)="submitForm()"
    >
      @if (isLoading()) {
      <ion-spinner name="dots" color="light"></ion-spinner>
      } @else { Submit }
    </ion-button>
  </div>
</div>
